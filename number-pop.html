<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google-adsense-account" content="ca-pub-4334559736616743"><title>숫자팡 90초 챌린지</title><style>*{box-sizing:border-box}body{margin:0;background:#151d37;color:#fff;font:16px system-ui,sans-serif;text-align:center}main{max-width:530px;margin:auto;padding:18px}h1{margin:12px 0}p{line-height:1.6}.stats{display:flex;justify-content:space-around;background:#273353;padding:16px;border-radius:16px;margin:16px 0}.stats b{display:block;font-size:24px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.tile{border:0;border-radius:13px;aspect-ratio:1;font-size:clamp(20px,6vw,31px);font-weight:900;color:#142038;touch-action:manipulation;cursor:pointer}.tile.sel{outline:5px solid #fff;outline-offset:-5px;transform:scale(.96)}button{font:inherit}#start{padding:14px 30px;border:0;border-radius:12px;background:#ffca45;font-weight:800;cursor:pointer}.ad{border:1px dashed #8290b5;padding:24px;margin:20px 0;border-radius:12px;color:#bdc9e6}a{color:#b9d7ff}#msg{min-height:45px;font-weight:700}</style></head><body><main><a href="/">← 홈으로</a><h1>🔢 숫자팡!</h1><p>같은 숫자 두 개를 차례로 눌러 합치세요. 90초 동안 최고 점수에 도전!</p><div class="stats"><div>남은 시간<b id="time">90</b></div><div>점수<b id="score">0</b></div><div>최고 기록<b id="best">0</b></div></div><div id="board" class="board" aria-label="숫자 게임판"></div><p id="msg" aria-live="polite">시작 버튼을 누르세요.</p><button id="start">게임 시작</button><div class="ad">광고 영역 · 승인 후 광고 게재 예정</div><p>게임 안내: 같은 숫자를 합칠 때 점수를 얻습니다. 선택을 취소하려면 같은 칸을 다시 누르세요. 기록은 이 브라우저에 저장됩니다.</p></main><script>
const board=document.getElementById('board'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),msg=document.getElementById('msg'),start=document.getElementById('start');
let cells=[],selected=-1,score=0,left=90,timer=null,active=false,combo=0;
let best=Number(localStorage.getItem('numberpop-best')||0);bestEl.textContent=best;
const randomTile=()=>Math.random()<.8?2:4;
function render(){board.innerHTML='';cells.forEach((n,i)=>{const b=document.createElement('button');b.className='tile'+(i===selected?' sel':'');b.textContent=n;b.style.background=['#fff2bb','#ffe09a','#ffc681','#ffa87a','#f98c88','#d9a4f8','#9acbff','#a5f0cf'][Math.min(7,Math.log2(n)-1)]||'#fff';b.disabled=!active;b.setAttribute('aria-label',n+' 숫자');b.onclick=()=>pick(i);board.appendChild(b)})}
function pick(i){if(!active)return;if(selected===-1){selected=i;msg.textContent=cells[i]+' 선택! 같은 숫자를 누르세요.'}else if(selected===i){selected=-1;msg.textContent='선택 취소'}else if(cells[selected]===cells[i]){const val=cells[i]*2;cells[i]=val;cells[selected]=randomTile();selected=-1;combo++;score+=val* Math.min(combo,5);scoreEl.textContent=score;msg.textContent='✨ '+val+' 완성! '+(combo>1?combo+'연속 콤보!':'');if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('numberpop-best',best)} }else{selected=i;combo=0;msg.textContent='다른 숫자예요. 새 숫자를 선택했어요.'}render()}
function finish(){clearInterval(timer);active=false;selected=-1;start.textContent='다시 하기';msg.textContent='⏰ 종료! 최종 점수 '+score+'점 · 다시 도전해 보세요!';render()}
function begin(){clearInterval(timer);cells=Array.from({length:16},randomTile);selected=-1;score=0;combo=0;left=90;active=true;scoreEl.textContent=0;timeEl.textContent=90;start.textContent='처음부터 다시';msg.textContent='같은 숫자 두 개를 찾아보세요!';render();timer=setInterval(()=>{left--;timeEl.textContent=left;if(left<=0)finish()},1000)}
start.onclick=begin;cells=Array.from({length:16},randomTile);render();
</script></body></html>
